[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-harness"
version = "0.1.0"
description = "Daemon-free, notebook-friendly host harness for coding benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Banana Harness contributors"}]
keywords = ["swe-bench", "livecodebench", "terminal-bench", "notebook", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
models = ["litellm>=1.75,<2"]
transformers = ["transformers>=4.56,<5", "torch>=2.6", "accelerate>=1,<2"]
datasets = ["datasets>=3,<5"]
rootfs = ["udocker==1.3.17"]
livecode = ["numpy>=1.24,<3"]
klein = ["klein-code-bench @ https://huggingface.co/datasets/klein-ml/klein-code-bench/resolve/072246b6c125b3de01eb5a7740b89326438eb46e/dist/klein_code_bench-0.1.0-py3-none-any.whl#sha256=d83fa0ec5908e855707323411d0b743581d57468b532bfd8097828ef96f11841 ; python_version >= '3.11'"]
swebench = ["swebench==4.1.0"]
all = ["litellm>=1.75,<2", "transformers>=4.56,<5", "torch>=2.6", "accelerate>=1,<2", "datasets>=3,<5", "udocker==1.3.17", "swebench==4.1.0", "numpy>=1.24,<3", "klein-code-bench @ https://huggingface.co/datasets/klein-ml/klein-code-bench/resolve/072246b6c125b3de01eb5a7740b89326438eb46e/dist/klein_code_bench-0.1.0-py3-none-any.whl#sha256=d83fa0ec5908e855707323411d0b743581d57468b532bfd8097828ef96f11841 ; python_version >= '3.11'"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.scripts]
banana = "banana_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

