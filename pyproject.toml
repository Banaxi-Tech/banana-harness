[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-harness"
version = "0.1.0"
description = "Daemon-free, notebook-friendly host harness for coding benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Banana Harness contributors"}]
keywords = ["swe-bench", "livecodebench", "terminal-bench", "notebook", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
models = ["litellm>=1.75,<2"]
datasets = ["datasets>=3,<5"]
rootfs = ["udocker==1.3.17"]
livecode = ["numpy>=1.24,<3"]
swebench = ["swebench==4.1.0"]
all = ["litellm>=1.75,<2", "datasets>=3,<5", "udocker==1.3.17", "swebench==4.1.0", "numpy>=1.24,<3"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.scripts]
banana = "banana_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

